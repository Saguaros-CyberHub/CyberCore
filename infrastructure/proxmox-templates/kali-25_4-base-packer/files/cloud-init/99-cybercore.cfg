# Cloud-init settings for Proxmox clones of this template.
# Installed to /etc/cloud/cloud.cfg.d/99-cybercore.cfg.

# Proxmox attaches cloud-init as a CD-ROM labelled "cidata" in nocloud format
# (citype=nocloud, its default for ostype=l26). Pinning the list stops
# cloud-init probing EC2/Azure/GCE metadata endpoints on every boot, which on an
# isolated lane VLAN means ~2 minutes of timeouts before the desktop appears.
# ConfigDrive stays as a fallback for anyone who flips citype to configdrive2.
datasource_list: [ NoCloud, ConfigDrive, None ]

datasource:
  NoCloud:
    fs_label: cidata

# Proxmox writes `users: [default]` plus a top-level `user:` into its
# user-data. cloud-init resolves `default` through this block, so the name here
# is only a fallback for the case where the Cloud-Init User field is left empty.
system_info:
  default_user:
    name: kali
    lock_passwd: false
    gecos: Kali
    groups: [adm, cdrom, sudo, dip, plugdev, users]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
  distro: debian
  network:
    renderers: ['eni']

# Root is left disabled, matching how Kali ships and how the preseed installs.
disable_root: true
ssh_pwauth: true

# The lane deployer resizes the clone's disk before first boot; growpart +
# resizefs are what turn that into usable space. Root is the last partition on
# the disk by design -- see the partitioning note in http/preseed.cfg.pkrtpl.
growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false
