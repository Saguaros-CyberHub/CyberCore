---
# ===========================================================================
# cc_web — plant the pivot credential.
#
# THIS IS THE POINT OF THE HOST. The web box is the one dual-homed machine on
# the lane (engagement-model.js: exactly one pivot, pinned to .240 on both
# segments). Everything else here — the banner, the ports, the weak TLS — is
# scenery that makes the report true. This file is the mechanism: a domain
# service account sitting in an application config, so that reading a file off a
# compromised web server turns into an Active Directory foothold. Remove it and
# the external engagement dead-ends with a defaced homepage.
#
# NOTHING BELOW MAY LOG. no_log is set on every task that touches the password,
# and the verification greps for the password over STDIN rather than putting it
# in a command line, where it would be visible in `ps`, in the ansible task
# banner and in the job log the instructor can read.
# ===========================================================================

- name: Create the directory the application configuration lives in
  ansible.builtin.file:
    path: "{{ cc_web_pivot.path | dirname }}"
    state: directory
    owner: "{{ cc_web_pivot.owner | default('root') }}"
    group: "{{ cc_web_pivot.group | default(cc_web_run_group) }}"
    mode: "{{ cc_web_pivot.dir_mode | default('0750') }}"

- name: Write the application configuration that names the domain account
  # 0640 root:www-data by default: unreadable to an unauthenticated HTTP
  # request, readable to the process that serves the site. That is the exercise
  # — the credential is reachable only once the attacker is executing as the web
  # user — and it is why a path inside the docroot needs an explicit
  # allow_in_docroot in tasks/assert.yml.
  ansible.builtin.template:
    src: pivot-credential.j2
    dest: "{{ cc_web_pivot.path }}"
    owner: "{{ cc_web_pivot.owner | default('root') }}"
    group: "{{ cc_web_pivot.group | default(cc_web_run_group) }}"
    mode: "{{ cc_web_pivot.mode | default('0640') }}"
  no_log: true
