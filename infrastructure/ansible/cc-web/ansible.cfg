; ===========================================================================
; cc-web — CyberCore's own ansible tree.
;
; THIS FILE IS THE BOUNDARY. Everything under ./roles is CyberCore-owned and
; freely editable; everything reachable through the LATER roles_path entries is
; upstream GOAD and is READ-ONLY. Extending GOAD by editing GOAD is how a fork
; stops being a pinned fork: ciab-goad-role-manifest.test.js asserts the bake
; script and the vendored manifest name the same 40-char commit, and a local
; edit to ansible/roles/ makes that SHA a lie without changing a single tracked
; byte (GOAD-main/ is gitignored and has zero tracked files, so the edit shows
; up in no diff and on no other machine).
;
; The layout below is upstream's OWN extension pattern, not an invention:
; extensions/{exchange,guacamole,lx01,ws01}/ansible/ansible.cfg each carry
;   roles_path = ./roles:../../../ansible/roles
; with the comment "add default roles folder into roles_path". We do the same
; thing from a sibling tree instead of from inside extensions/, so a `git pull`
; on the fork never touches us and we never touch it.
;
; WHY LOCAL FIRST, AND WHY THAT IS SAFE
; ansible resolves a role name against roles_path left to right and takes the
; FIRST hit, so ./roles first means `cc_web` always resolves here even if a
; future upstream ever shipped that name. Precedence alone is not a safety
; property though — first-wins is exactly what makes shadowing possible — so
; the actual guarantee is the NAMING RULE:
;
;     every role in ./roles is named cc_<something>.
;
; Upstream has no cc_-prefixed role, so no ordering of this path can change
; which directory a GOAD play gets. That rule is enforced by
; front-end/test/ciab-cc-web-role.test.js, not by convention.
;
; Name collisions in this ecosystem are not hypothetical: the pinned GOAD tree
; already contains TWO different roles called adcs_templates —
; ansible/roles/adcs_templates and ansible/roles/vulns/adcs_templates — and
; they are resolved by different playbooks through different path entries. A
; third one arriving from a CyberCore tree would be resolved by whichever entry
; came first, silently, on a 90-minute bake.
;
; The GOAD entries are listed twice on purpose: /opt/goad is where
; bake-goad-controller-vm.sh clones upstream on the baked controller template,
; and the ../../../GOAD-main path is where a developer's working copy sits in
; this repo. ansible skips roles_path entries that do not exist, so carrying
; both costs nothing and means the same cfg works on the controller and on a
; laptop.
; ===========================================================================

[defaults]
host_key_checking     = false
display_skipped_hosts = false
show_per_host_start   = True
deprecation_warning   = false

; LOCAL TREE FIRST. See the header for why this ordering is not itself the
; safety property. Do not reorder without reading it.
roles_path = ./roles:/opt/goad/ansible/roles:../../../GOAD-main/ansible/roles:$HOME/.ansible/roles:/etc/ansible/roles

; Every task in cc_web is expected to be honest about changed/failed, so a
; per-task recap is worth the noise: "ok" on a re-run is the re-runnability
; claim being demonstrated rather than asserted.
stdout_callback = default

[ssh_connection]
; The DMZ web host is a plain Linux VM reached over SSH from the orchestrator.
pipelining = true
