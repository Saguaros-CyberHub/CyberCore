<!-- Additive CyberCoreInfrastructure group; assign only the inventoried infrastructure IDs.
     Exact name filters provide an additional guard against accidental student assignment.
     No collector here replaces or duplicates the existing journald/auditd collectors. -->
<agent_config name="^cyberhub-node-0$|^cyberhub-node-1$|^cyberhub-node-2$|^cyberhub-node-3$|^cyberhub-node-4$|^cyberhub-node-5$|^cyberhub-node-6$|^cyberhub-node-10$|^cyberhub-node-11$|^250-CyberCore$|^251-netbox$|^252-heimdall-dashboard$">
  <labels>
    <label key="cybercore.environment">infrastructure</label>
  </labels>
  <syscheck>
    <disabled>no</disabled>
    <!-- This is the interval for ALL merged scheduled FIM paths, not just those below. -->
    <frequency>900</frequency>
    <scan_on_start>yes</scan_on_start>
    <!-- Hashes/metadata only, including paths inherited from other groups/local config. -->
    <nodiff type="sregex">^/</nodiff>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,identity">/etc/ssh,/etc/sudoers.d,/etc/pam.d,/etc/security,/root/.ssh</directories>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,persistence">/etc/cron.d,/etc/systemd/system,/var/spool/cron</directories>
    <!-- Individual files use scheduled scans: inotify realtime requires a directory. -->
    <directories check_all="yes" report_changes="no" tags="cybercore_infrastructure,identity">/etc/passwd,/etc/group,/etc/shadow,/etc/gshadow,/etc/sudoers,/etc/crontab</directories>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,monitoring">/var/ossec/etc</directories>
  </syscheck>
</agent_config>

<agent_config name="^cyberhub-node-0$|^cyberhub-node-1$|^cyberhub-node-2$|^cyberhub-node-3$|^cyberhub-node-4$|^cyberhub-node-5$|^cyberhub-node-6$|^cyberhub-node-10$|^cyberhub-node-11$">
  <labels>
    <label key="cybercore.role">proxmox</label>
  </labels>
  <syscheck>
    <!-- pmxcfs is cluster-backed: scheduled verification is required, including remote changes.
         Do not add all qemu-server/lxc configs: ordinary lane lifecycle writes are expected. -->
    <directories check_all="yes" report_changes="no" tags="cybercore_infrastructure,proxmox_control">/etc/pve/user.cfg,/etc/pve/domains.cfg,/etc/pve/datacenter.cfg,/etc/pve/storage.cfg,/etc/pve/corosync.conf</directories>
    <directories check_all="yes" report_changes="no" tags="cybercore_infrastructure,proxmox_identity">/etc/pve/priv</directories>
    <directories check_all="yes" report_changes="no" tags="cybercore_infrastructure,firewall">/etc/pve/firewall/cluster.fw,/etc/pve/nodes/*/host.fw</directories>
    <directories check_all="yes" report_changes="no" tags="cybercore_infrastructure,network">/etc/network/interfaces,/etc/hosts,/etc/hostname</directories>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,network">/etc/network/interfaces.d,/etc/ceph</directories>
    <!-- HA runtime status generated thousands of alerts/day on node 1. Exact sregex matches
         retain firewall, users, guest configs, and other /etc/pve monitoring already configured. -->
    <ignore type="sregex">^/etc/pve/nodes/cyberhub-node-0/lrm_status$|^/etc/pve/nodes/cyberhub-node-1/lrm_status$|^/etc/pve/nodes/cyberhub-node-2/lrm_status$|^/etc/pve/nodes/cyberhub-node-3/lrm_status$|^/etc/pve/nodes/cyberhub-node-4/lrm_status$|^/etc/pve/nodes/cyberhub-node-5/lrm_status$|^/etc/pve/nodes/cyberhub-node-6/lrm_status$|^/etc/pve/nodes/cyberhub-node-10/lrm_status$|^/etc/pve/nodes/cyberhub-node-11/lrm_status$</ignore>
  </syscheck>
</agent_config>

<agent_config name="^250-CyberCore$">
  <labels>
    <label key="cybercore.role">application</label>
  </labels>
  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,identity">/home/cactus-admin/.ssh</directories>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,persistence">/home/cactus-admin/.config/systemd/user</directories>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,application_config">/etc/docker,/home/cactus-admin/CyberCore/config,/home/cactus-admin/CyberCore/secrets</directories>
    <directories check_all="yes" report_changes="no" tags="cybercore_infrastructure,application_config">/home/cactus-admin/CyberCore/.env,/home/cactus-admin/CyberCore/docker-compose.yml,/home/cactus-admin/CyberCore/front-end/Dockerfile,/home/cactus-admin/CyberCore/front-end/package.json,/home/cactus-admin/CyberCore/front-end/package-lock.json</directories>
    <directories check_all="yes" realtime="yes" report_changes="no" tags="cybercore_infrastructure,application_code">/home/cactus-admin/CyberCore/front-end/src,/home/cactus-admin/CyberCore/front-end/public,/home/cactus-admin/CyberCore/front-end/plugins</directories>
  </syscheck>
  <localfile>
    <location>/home/cactus-admin/CyberCore/logs/security-*.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</agent_config>
