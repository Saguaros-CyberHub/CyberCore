# CyberSaguaros Research Portal — nginx site config.
#
# The PHP-FPM socket name is fixed and version-independent so this file does
# not have to track the PHP version Debian ships.
#
# /uploads/ is served from the webroot on purpose: the gallery archive is
# public. Do not add a static-only override for it — the portal links objects
# back out of that directory and an override breaks contributed imagery.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/cybersaguaros/public;
    index index.php index.html;

    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Internal provisioning API — loopback only.
    # ^~ makes this prefix authoritative so it wins over the generic PHP regex
    # location below; allow/deny then gates it to 127.0.0.1.
    location ^~ /api/internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm-cybersaguaros.sock;
        }
    }

    # Dotfiles. Declared before the PHP handler: regex locations are matched in
    # file order, so this has to come first to cover dotted script names too.
    location ~ /\. {
        deny all;
    }

    location ~ \.(php|phar|phtml)$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm-cybersaguaros.sock;
    }
}
