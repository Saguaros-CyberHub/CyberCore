; CyberSaguaros Research Portal — PHP-FPM pool.
;
; Installed into /etc/php/<version>/fpm/pool.d/cybersaguaros.conf by the
; provisioning run. The portal runs as the unprivileged `saguarobot` service
; account rather than www-data so portal processes are separable from anything
; else nginx serves on the host.

[cybersaguaros]
user = saguarobot
group = saguarobot

; Fixed socket name so the nginx config is independent of the PHP version.
listen = /run/php/php-fpm-cybersaguaros.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M

security.limit_extensions = .php
